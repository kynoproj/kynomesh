name: Docs

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "stable"
  pull_request:
    branches:
      - main

jobs:
  docs:
    if: github.repository == 'kynoproj/kynomesh'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.9
      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Install docs deps
        run: make /usr/local/bin/mkdocs /usr/local/bin/lychee
      - name: Link check
        run: make docs-linkcheck
      - name: Build (PR — no deploy)
        if: github.event_name == 'pull_request'
        run: python -m mkdocs build
      - name: Deploy main as 'latest'
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mike deploy --push --update-aliases latest
      - name: Deploy 'stable' tag
        if: github.ref == 'refs/tags/stable'
        run: |
          mike deploy --push stable
          mike set-default --push stable
      - name: Deploy versioned release (vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          MINOR=${VERSION%.*}
          mike deploy --push "$MINOR"
