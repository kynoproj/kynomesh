name: Nightly-build

on:
  schedule:
    - cron: "51 23 * * *"
  push:
    branches:
      - dev-nightly*

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-go-binaries:
    runs-on: ubuntu-latest
    if: github.repository == 'kynoproj/kynomesh'
    name: Build binaries
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Build binaries
        run: |
          make build
          chmod -R +x dist
      - name: Make checksums
        run: make checksums
      - name: Store artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist

  build-push-linux-multi:
    name: Build & push linux/amd64 and linux/arm64
    needs: [build-go-binaries]
    runs-on: ubuntu-latest
    if: github.repository == 'kynoproj/kynomesh'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Setup Node-Cache
        uses: actions/cache@v6
        with:
          path: ui/node_modules
          key: ${{ runner.os }}-node-dep-v1-${{ hashFiles('**/yarn.lock') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download Go binaries
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist/

      - name: Registry login
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAYIO_USERNAME }}
          password: ${{ secrets.QUAYIO_PASSWORD }}

      - name: Set version
        id: version
        run: |
          tag=$(date +"%Y%m%d")
          echo "VERSION=nightly-$tag" >> $GITHUB_OUTPUT

      - name: Container build and push with arm64/amd64
        run: |
          IMAGE_NAMESPACE=${{ secrets.QUAYIO_ORG }} VERSION=${{ steps.version.outputs.VERSION }} DOCKER_PUSH=true DOCKER_BUILD_ARGS="--label \"quay.expires-after=30d\"" make image-multi
