name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - dev-release*

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    if: github.repository == 'kynoproj/kynomesh'
    name: Build binaries
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Build binaries
        run: |
          make build
          chmod -R +x dist
      - name: Make checksums
        run: make checksums
      - name: Store artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist

  build-push-linux-multi:
    name: Build & push linux/amd64 and linux/arm64
    needs: [build-binaries]
    runs-on: ubuntu-latest
    if: github.repository == 'kynoproj/kynomesh'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Setup Node-Cache
        uses: actions/cache@v5
        with:
          path: ui/node_modules
          key: ${{ runner.os }}-node-dep-v1-${{ hashFiles('**/yarn.lock') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download Go binaries
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist/

      - name: Registry login
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAYIO_USERNAME }}
          password: ${{ secrets.QUAYIO_PASSWORD }}

      - name: Set version
        id: version
        run: |
          tag=$(basename $GITHUB_REF)
          if [ $tag = "main" ]; then
            tag="latest"
          fi
          echo "VERSION=$tag" >> $GITHUB_OUTPUT

      - name: Container build and push with arm64/amd64
        run: |
          IMAGE_NAMESPACE=${{ secrets.QUAYIO_ORG }} VERSION=${{ steps.version.outputs.VERSION }} DOCKER_PUSH=true make image-multi

  bom:
    name: Bom
    runs-on: ubuntu-latest
    if: github.repository == 'kynoproj/kynomesh'
    needs: [build-push-linux-multi]
    steps:
      - run: |
          if [ ${GITHUB_REF##*/} = main ]; then
            echo "VERSION=latest" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF##*/}" >> $GITHUB_ENV
          fi
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false
      - uses: actions/checkout@v7
      - run: go install sigs.k8s.io/bom/cmd/bom@v0.2.0
      - run:
          go install github.com/spdx/spdx-sbom-generator/cmd/generator@v0.0.13
      - run: mkdir -p dist
      - run: generator -o /tmp -p .
      - run:
          bom generate --image quay.io/kynoproj/kynomesh:$VERSION -o
          /tmp/kynomesh.spdx
      # pack the boms into one file to make it easy to download
      - run: cd /tmp && tar -zcf sbom.tar.gz *.spdx
      - uses: actions/upload-artifact@v7
        with:
          name: sbom.tar.gz
          path: /tmp/sbom.tar.gz

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository == 'kynoproj/kynomesh'
    needs: [build-push-linux-multi, bom]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set version
        run: |
          if [ ${GITHUB_REF##*/} = main ]; then
            echo "VERSION=latest" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF##*/}" >> $GITHUB_ENV
          fi
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: sbom.tar.gz
          path: /tmp
      - name: Registry login
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAYIO_USERNAME }}
          password: ${{ secrets.QUAYIO_PASSWORD }}
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: "v3.0.2"

      - name: Install crane to get digest of image
        uses: imjasonh/setup-crane@59c71e96a00b28651f10369ba3359a6d730740a0 # v0.6

      - name: Get digests of container images
        run: |
          echo "IMAGE_DIGEST=$(crane digest quay.io/kynoproj/kynomesh:$VERSION)" >> $GITHUB_ENV
      - name: Sign Kynomesh container images and assets
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY quay.io/kynoproj/kynomesh@${{ env.IMAGE_DIGEST }}
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --bundle ./dist/kynomesh-checksums.sig ./dist/kynomesh-checksums.txt
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --bundle /tmp/sbom.tar.gz.sig /tmp/sbom.tar.gz
          # Retrieves the public key to release as an asset
          cosign public-key --key env://COSIGN_PRIVATE_KEY --outfile ./dist/kynomesh-cosign.pub
        env:
          COSIGN_PRIVATE_KEY: ${{secrets.COSIGN_PRIVATE_KEY}}
          COSIGN_PASSWORD: ${{secrets.COSIGN_PASSWORD}}

      - name: Release binaries
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/kynomesh-*.gz
            dist/kynomesh-checksums.txt
            dist/kynomesh-checksums.sig
            dist/kynomesh-cosign.pub
            config/*.yaml
            /tmp/sbom.tar.gz
            /tmp/sbom.tar.gz.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
