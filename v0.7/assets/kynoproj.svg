 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
    <rect width="256" height="256" rx="48" fill="#FFFFFF"/>

    <!-- Dog head: stroke-only outline (no fill). Drawn as one continuous
         path so the join between ears and head is a single stroke run. -->
    <g fill="none" stroke="#000000" stroke-width="6" stroke-linejoin="round" 
  stroke-linecap="round">
      <!-- Left ear -->
      <path d="M 64 70 L 88 36 L 100 92 Z"/>
      <!-- Right ear -->
      <path d="M 192 70 L 168 36 L 156 92 Z"/>
      <!-- Head outline -->
      <path d="M 80 96
               C 80 64, 176 64, 176 96
               L 168 168
               C 168 192, 88 192, 88 168
               Z"/>
    </g>

    <!-- Eyes & snout: small filled black dots inside the outlined head. -->
    <g fill="#000000">
      <circle cx="108" cy="124" r="7"/>
      <circle cx="148" cy="124" r="7"/>
      <circle cx="128" cy="158" r="6"/>
    </g>

    <!-- Mesh "collar" — three nodes + linking edges across the chin. -->
    <g stroke="#000000" stroke-width="5" stroke-linecap="round">
      <line x1="92"  y1="188" x2="128" y2="204"/>
      <line x1="128" y1="204" x2="164" y2="188"/>
    </g>
    <g fill="#000000">
      <circle cx="92"  cy="188" r="7"/>
      <circle cx="128" cy="204" r="7"/>
      <circle cx="164" cy="188" r="7"/>
    </g>
  </svg>