apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../config/cluster-install
  - ../../config/extensions/webhook

patches:
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KYNOMESH_IMAGE_PULL_POLICY
          value: IfNotPresent
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KYNOMESH_DEBUG
          value: !!str "true"
    target:
      kind: Deployment
      name: kynomesh-controller
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
    target:
      kind: Deployment
      name: kynomesh-webhook
  - patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: kynomesh-cmd-params-config
      data:
        controller.leader.election.disabled: "true"

namespace: kynomesh-system

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: kynomesh
