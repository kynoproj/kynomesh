apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - crds/full
  - shared-config
  - controller-manager

images:
  - name: quay.io/kynoproj/kynomesh
    newTag: latest

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kynomesh-controller
      spec:
        template:
          spec:
            containers:
              - name: controller-manager
                env:
                  - name: KYNOMESH_IMAGE
                    value: quay.io/kynoproj/kynomesh:latest
