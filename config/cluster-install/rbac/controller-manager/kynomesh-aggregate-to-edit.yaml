apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
  name: kynomesh-aggregate-to-edit
rules:
  - apiGroups:
      - kynomesh.kyno.sh
    resources:
      - agentsets
      - agentsets/finalizers
      - agentsets/status
      - agentdeploys
      - agentdeploys/finalizers
      - agentdeploys/status
      - agentdeploys/scale
    verbs:
      - create
      - delete
      - deletecollection
      - get
      - list
      - patch
      - update
      - watch
