apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kynomesh-role
  labels:
    app.kubernetes.io/name: kynomesh-controller-manager
    app.kubernetes.io/part-of: kynomesh
    app.kubernetes.io/component: controller-manager
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
