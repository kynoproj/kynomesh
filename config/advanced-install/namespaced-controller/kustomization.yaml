#
# Controller only with namespaced install, witout CRD
#

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/shared-config
  - ../../base/controller-manager
  - ../../namespace-install/rbac/controller-manager

images:
  - name: quay.io/kynoproj/kynomesh
    newTag: v0.6.0

patches:
  # For release scripts
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: kynomesh-cmd-params-config
      data:
        namespaced: "true"
