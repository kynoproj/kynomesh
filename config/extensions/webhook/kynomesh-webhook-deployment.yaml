apiVersion: apps/v1
kind: Deployment
metadata:
  name: kynomesh-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kynomesh-webhook
      app.kubernetes.io/part-of: kynomesh
      app.kubernetes.io/component: kynomesh-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kynomesh-webhook
        app.kubernetes.io/part-of: kynomesh
        app.kubernetes.io/component: kynomesh-webhook
    spec:
      serviceAccountName: kynomesh-webhook-sa
      containers:
        - name: webhook
          image: quay.io/kynoproj/kynomesh:latest
          imagePullPolicy: Always
          args:
            - webhook
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PORT
              value: "443"
            - name: DEPLOYMENT_NAME
              value: kynomesh-webhook
            - name: SERVICE_NAME
              value: kynomesh-webhook
            - name: CLUSTER_ROLE_NAME
              value: kynomesh-webhook
          resources:
            limits:
              cpu: 500m
              memory: 1024Mi
            requests:
              cpu: 100m
              memory: 200Mi
