syntax = "proto3";

package kynomesh.daemon.v1;

option go_package = "github.com/kynoproj/kynomesh/pkg/apis/proto/daemon";

import "google/api/annotations.proto";
import "google/protobuf/wrappers.proto";

// TransportWindowedMetrics carries per-window aggregations for a single
// transport bucket (e.g. "jsonrpc", "rest", "grpc", "passthrough").
//
// Keys for the inner maps are window labels: "1m", "5m", "15m" are
// always populated when sufficient samples exist; "custom" is populated
// only when the caller requests a non-zero lookback_seconds.
//
// processingRates values are requests-per-second over the window: one
// HTTP request completion or one gRPC stream close counts as one.
//
// streamMessageRates values are stream-messages-per-second over the
// window: one SSE event (REST/passthrough) or one server→client gRPC
// frame counts as one. Stays at zero for unary responses.
//
// inflights values are time-weighted average in-flight requests over
// the window.
//
// Absent keys in any map mean "no data available for this window."
// Callers must check presence before reading a value.
message TransportWindowedMetrics {
  map<string, google.protobuf.DoubleValue> processingRates = 1;
  map<string, google.protobuf.DoubleValue> inflights = 2;
  map<string, google.protobuf.DoubleValue> streamMessageRates = 3;
}

// AgentDeployMetrics carries the aggregated, time-windowed metrics for a
// single AgentDeploy that this daemon scrapes.
message AgentDeployMetrics {
  string agentdeploy = 1;

  // Totals across all transports. Keys: "1m", "5m", "15m", "custom".
  // See TransportWindowedMetrics for the per-key value semantics.
  map<string, google.protobuf.DoubleValue> processingRates = 2;
  map<string, google.protobuf.DoubleValue> streamMessageRates = 3;
  map<string, google.protobuf.DoubleValue> inflights = 4;

  // Per-transport breakdown. Keys are the transport label values emitted
  // by the broker (e.g. "jsonrpc", "rest", "grpc", "passthrough"). The
  // daemon is label-agnostic and exposes whatever values it observes.
  map<string, TransportWindowedMetrics> byTransport = 5;

  // The actual window used for the "custom" key, after clamping to the
  // daemon's retention. Unset when the caller did not request a custom
  // lookback.
  google.protobuf.Int64Value custom_window_effective_seconds = 6;
}

message GetAgentDeployMetricsRequest {
  // AgentDeploy name. Must be one of the AgentDeploys this daemon is
  // configured to track. Returns NotFound otherwise.
  string name = 1;

  // Optional caller-supplied lookback in seconds. When > 0, the daemon
  // computes an additional "custom" window. Values above the daemon's
  // retention are clamped silently; the actual window used is echoed
  // back in custom_window_effective_seconds.
  int64 lookback_seconds = 2;
}

message GetAgentDeployMetricsResponse {
  AgentDeployMetrics metrics = 1;
}

// DaemonService is the gRPC + REST surface the controller calls to read
// near-realtime metrics for AgentDeploys belonging to a single AgentSet.
service DaemonService {
  rpc GetAgentDeployMetrics(GetAgentDeployMetricsRequest) returns (GetAgentDeployMetricsResponse) {
    option (google.api.http).get = "/api/v1/agentdeploys/{name}/metrics";
  };
}
